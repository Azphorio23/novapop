<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración · NovaPop</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <script src="/js/tema.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="admin-login">
  <button class="btn btn-outline-secondary btn-sm boton-tema position-fixed top-0 end-0 m-3" onclick="novapopTema.alternar()"
          aria-label="Cambiar tema claro u oscuro">
    <i class="bi bi-sun-fill solo-oscuro"></i><i class="bi bi-moon-stars-fill solo-claro"></i>
  </button>

  <main class="container d-flex align-items-center justify-content-center min-vh-100 py-4">
    <div class="card shadow-lg border-0" style="width: min(420px, 100%)">
      <div class="card-body p-4 p-md-5">
        <div class="d-flex align-items-center gap-2 mb-4">
          <img src="/img/logo.svg" alt="" width="44" height="44">
          <div>
            <div class="fs-4 fw-bold lh-1">Nova<span class="text-warning">Pop</span></div>
            <small class="text-body-secondary">Panel de administración</small>
          </div>
        </div>
        <h1 class="h4 mb-1">Acceso del personal</h1>
        <p class="text-body-secondary small mb-4">Gestión de catálogos, contenido, planes y cuentas.</p>
        <div class="alert alert-danger d-none py-2" id="error" role="alert"></div>
        <form id="form" novalidate>
          <div class="form-floating mb-3">
            <input class="form-control" id="usuario" placeholder="usuario" autocomplete="username" required>
            <label for="usuario">Usuario o correo</label>
          </div>
          <div class="form-floating mb-3">
            <input class="form-control" id="clave" type="password" placeholder="clave" autocomplete="current-password" required>
            <label for="clave">Contraseña</label>
          </div>
          <button class="btn btn-warning w-100 fw-semibold py-2" id="btn">
            <span class="spinner-border spinner-border-sm d-none me-1" id="cargando"></span> Ingresar
          </button>
        </form>
        <div class="alert alert-secondary small mt-4 mb-0">
          <i class="bi bi-info-circle"></i> Usuarios de prueba (clave <b>Admin2026!</b>):
          <b>admin</b> (todo), <b>editor</b> y <b>soporte</b> (sin el módulo de Seguridad).
        </div>
        <p class="text-center small mt-3 mb-0"><a href="/" class="link-secondary">← Ir a NovaPop</a></p>
      </div>
    </div>
  </main>

  <script type="module">
    const $ = id => document.getElementById(id);
    if (localStorage.getItem('np_admin_token')) location.replace('/admin/');

    $('form').addEventListener('submit', async e => {
      e.preventDefault();
      $('error').classList.add('d-none');
      $('btn').disabled = true;
      $('cargando').classList.remove('d-none');
      try {
        const r = await fetch('/api/admin/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario: $('usuario').value.trim(), clave: $('clave').value }),
        });
        const datos = await r.json();
        if (!r.ok) throw new Error(datos.mensaje || 'No se pudo ingresar');
        localStorage.setItem('np_admin_token', datos.token);
        localStorage.setItem('np_admin_usuario', JSON.stringify({ usuario: datos.usuario, nombres: datos.nombres, rol: datos.rol }));
        location.href = '/admin/';
      } catch (err) {
        $('error').textContent = err.message === 'Failed to fetch' ? 'No hay conexión con el servidor' : err.message;
        $('error').classList.remove('d-none');
      } finally {
        $('btn').disabled = false;
        $('cargando').classList.add('d-none');
      }
    });
  </script>
</body>
</html>
