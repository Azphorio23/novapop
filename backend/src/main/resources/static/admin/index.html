<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · NovaPop</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <script src="/js/tema.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <!-- Barra superior -->
  <nav class="navbar navbar-expand bg-body border-bottom sticky-top px-3">
    <button class="btn btn-link text-body d-lg-none me-2 p-0" data-bs-toggle="offcanvas" data-bs-target="#menu" aria-label="Menú">
      <i class="bi bi-list fs-3"></i>
    </button>
    <a class="navbar-brand d-flex align-items-center gap-2" href="#/">
      <img src="/img/logo.svg" alt="" width="32" height="32">
      <span class="fw-bold">Nova<span class="text-warning">Pop</span> <span class="fw-normal text-body-secondary d-none d-sm-inline">Admin</span></span>
    </a>
    <div class="ms-auto d-flex align-items-center gap-2">
      <a class="btn btn-sm btn-outline-secondary d-none d-md-inline-flex align-items-center gap-1" href="/" target="_blank">
        <i class="bi bi-box-arrow-up-right"></i> Ver sitio
      </a>
      <button class="btn btn-sm btn-outline-secondary boton-tema" onclick="novapopTema.alternar()" aria-label="Cambiar tema claro u oscuro">
        <i class="bi bi-sun-fill solo-oscuro"></i><i class="bi bi-moon-stars-fill solo-claro"></i>
      </button>
      <div class="dropdown">
        <button class="btn btn-sm btn-warning dropdown-toggle fw-semibold" data-bs-toggle="dropdown" id="usuarioActual">…</button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><span class="dropdown-item-text small text-body-secondary" id="rolActual"></span></li>
          <li><hr class="dropdown-divider"></li>
          <li><button class="dropdown-item" id="salir"><i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión</button></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="d-flex">
    <!-- Menú lateral: offcanvas en móvil, fijo en escritorio -->
    <aside class="offcanvas-lg offcanvas-start border-end bg-body-tertiary menu-lateral" tabindex="-1" id="menu">
      <div class="offcanvas-header d-lg-none">
        <h2 class="offcanvas-title h5">Módulos</h2>
        <button class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#menu" aria-label="Cerrar"></button>
      </div>
      <div class="offcanvas-body d-block p-3" id="navegacion"></div>
    </aside>

    <main class="flex-grow-1 p-3 p-md-4 contenido-admin" id="vista"></main>
  </div>

  <!-- Formulario de alta / edición -->
  <div class="modal fade" id="modalForm" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-sm-down">
      <form class="modal-content" id="form" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="formTitulo"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-danger d-none py-2" id="formError"></div>
          <div class="row g-3" id="formCampos"></div>
          <div class="small text-body-secondary mt-4 border-top pt-3 d-none" id="formAuditoria"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-warning fw-semibold" id="formGuardar">
            <span class="spinner-border spinner-border-sm d-none me-1"></span>Guardar
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Confirmación -->
  <div class="modal fade" id="modalConfirmar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body p-4 text-center">
          <i class="bi bi-exclamation-triangle text-warning display-5"></i>
          <p class="mt-3 mb-0" id="confirmarTexto"></p>
        </div>
        <div class="modal-footer justify-content-center">
          <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-danger" id="confirmarSi">Sí, continuar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
