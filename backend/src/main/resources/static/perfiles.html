<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¿Quién está viendo? · NovaPop</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <script src="/js/tema.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <button class="btn-tema flotante" onclick="novapopTema.alternar()" aria-label="Cambiar tema claro u oscuro" title="Cambiar tema"><span class="solo-oscuro"><svg class="ico-tema sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.3" fill="currentColor"/><path d="M12 2.6v2.3M12 19.1v2.3M2.6 12h2.3M19.1 12h2.3M5.4 5.4l1.6 1.6M17 17l1.6 1.6M5.4 18.6 7 17M17 7l1.6-1.6" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg></span><span class="solo-claro"><svg class="ico-tema luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 14.6A8.4 8.4 0 0 1 9.4 3.8a8.4 8.4 0 1 0 10.8 10.8z" fill="currentColor"/><path d="M16.6 3.2l.55 1.45 1.45.55-1.45.55-.55 1.45-.55-1.45-1.45-.55 1.45-.55z" fill="currentColor"/></svg></span></button>
  <main class="pagina-perfiles">
    <div>
      <a href="/" class="marca grande"><img src="/img/logo.svg" alt=""><span>Nova<span class="pop">Pop</span></span></a>
      <h1 id="titulo">¿Quién está viendo?</h1>
      <div class="lista-perfiles" id="lista"></div>
      <div style="margin-top:44px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-borde" id="btnAdministrar">Administrar perfiles</button>
        <a class="btn btn-borde" href="/cuenta.html" id="btnCuenta">Mi cuenta</a>
      </div>
    </div>
  </main>
  <script type="module">
    import { api, sesion, exigirSesion } from '/js/api.js';
    import { esc, avatar, icono, modal, pedirPin, toast, AVATARES, PERSONAJES, claveAvatar, nombrePersonaje } from '/js/ui.js';

    if (exigirSesion()) {
      sesion.olvidarPerfil();
      let perfiles = [];
      let idiomas = [];
      let administrando = false;
      const lista = document.getElementById('lista');

      async function cargar() {
        [perfiles, idiomas] = await Promise.all([api('/api/perfiles'), idiomas.length ? idiomas : api('/api/publico/idiomas')]);
        pintar();
      }

      function pintar() {
        document.getElementById('titulo').textContent = administrando ? 'Administrar perfiles' : '¿Quién está viendo?';
        document.getElementById('btnAdministrar').textContent = administrando ? 'Listo' : 'Administrar perfiles';
        lista.classList.toggle('administrando', administrando);
        lista.innerHTML = perfiles.map(p => `
          <button class="perfil" data-id="${p.id}" aria-label="${administrando ? 'Editar' : 'Entrar como'} ${esc(p.nombre)}">
            <span class="marco">
              ${avatar(p.avatar)}
              ${administrando ? `<span class="editar">${icono('lapiz')}</span>` : ''}
              ${p.tienePin && !administrando ? `<span class="candado" title="Protegido con PIN">${icono('candado')}</span>` : ''}
            </span>
            <span class="nombre">${esc(p.nombre)}</span>
            ${p.esInfantil ? '<span class="chip-infantil">Infantil</span>' : ''}
          </button>`).join('') +
          (perfiles.length < 5 ? `<button class="perfil" id="nuevo"><span class="marco nuevo">${icono('mas')}</span><span class="nombre">Agregar perfil</span></button>` : '');

        lista.querySelectorAll('.perfil[data-id]').forEach(b => b.onclick = () => {
          const p = perfiles.find(x => x.id === Number(b.dataset.id));
          administrando ? editar(p) : entrar(p);
        });
        document.getElementById('nuevo')?.addEventListener('click', () => editar(null));
      }

      async function entrar(p) {
        if (p.tienePin) {
          const ok = await pedirPin(p.nombre, pin => api(`/api/perfiles/${p.id}/pin`, { method: 'POST', body: { pin } }));
          if (!ok) return;
        }
        sesion.elegirPerfil(p);
        location.href = '/inicio.html';
      }

      function editar(p) {
        const esNuevo = !p;
        const actual = p || { nombre: '', avatar: AVATARES[(perfiles.length * 3) % AVATARES.length], esInfantil: false, idIdiomaPreferido: idiomas.find(i => i.codigo === 'es')?.id };
        let elegido = claveAvatar(actual.avatar);
        const { el, cerrar } = modal(`
          <div class="panel-form">
          <h2>${esNuevo ? 'Nuevo perfil' : 'Editar perfil'}</h2>
          <form id="fPerfil" novalidate>
            <p class="error-form oculto" id="eP"></p>
            <div class="avatar-actual">
              <button type="button" class="avatar-boton" id="abrirGaleria" aria-label="Cambiar personaje">
                <span id="avatarVista">${avatar(elegido)}</span><span class="lapiz">${icono('lapiz')}</span>
              </button>
              <div><b id="nombrePersonaje">${esc(nombrePersonaje(elegido))}</b><small>Toca la imagen para elegir otro personaje</small></div>
            </div>
            <div class="campo"><label for="nombre">Nombre</label><input id="nombre" maxlength="50" value="${esc(actual.nombre)}" required></div>
            <div class="campo"><label for="idioma">Idioma preferido</label>
              <select id="idioma">${idiomas.filter(i => i.codigo !== 'zxx').map(i => `<option value="${i.id}" ${i.id === actual.idIdiomaPreferido ? 'selected' : ''}>${esc(i.nombre)}</option>`).join('')}</select></div>
            <label class="check"><input type="checkbox" id="infantil" ${actual.esInfantil ? 'checked' : ''}> Perfil infantil (solo contenido ATP y +7)</label>
            <div class="campo"><label for="pin">PIN de control parental (4 dígitos)</label>
              <input id="pin" inputmode="numeric" maxlength="4" placeholder="${actual.tienePin ? '•••• (deja vacío para mantenerlo)' : 'Opcional'}"></div>
            ${actual.tienePin ? '<label class="check"><input type="checkbox" id="quitarPin"> Quitar el PIN</label>' : ''}
            <div class="modal-acciones">
              ${!esNuevo ? '<button type="button" class="btn btn-peligro" id="borrar" style="margin-right:auto">Eliminar</button>' : ''}
              <button type="button" class="btn btn-borde" data-cerrar>Cancelar</button>
              <button class="btn btn-pop">Guardar</button>
            </div>
          </form>
          </div>
          <div class="panel-galeria oculto">
            <div class="galeria-cabecera">
              <button type="button" class="btn btn-sutil btn-icono" id="volverForm" aria-label="Volver">${icono('atras')}</button>
              <div><h2>Elige tu personaje</h2><small class="muted">Personajes de películas libres de NovaPop</small></div>
            </div>
            ${PERSONAJES.map(g => `
              <section class="galeria-grupo">
                <h3>${esc(g.pelicula)}</h3>
                <div class="galeria-fila">${g.personajes.map(([k, n]) => `
                  <button type="button" class="opcion-avatar" data-avatar="${k}" title="${esc(n)}" aria-label="${esc(n)}">${avatar(k)}<span>${esc(n)}</span></button>`).join('')}</div>
              </section>`).join('')}
          </div>`, { clase: 'modal-caja modal-perfil' });
        const panelForm = el.querySelector('.panel-form');
        const panelGaleria = el.querySelector('.panel-galeria');
        const marcarElegido = () => el.querySelectorAll('.opcion-avatar').forEach(b => b.classList.toggle('activo', b.dataset.avatar === elegido));
        const verGaleria = ver => { panelForm.classList.toggle('oculto', ver); panelGaleria.classList.toggle('oculto', !ver); el.querySelector('.modal-caja').scrollTop = 0; };
        el.querySelector('#abrirGaleria').onclick = () => { marcarElegido(); verGaleria(true); };
        el.querySelector('#volverForm').onclick = () => verGaleria(false);
        el.querySelectorAll('.opcion-avatar').forEach(b => b.onclick = () => {
          elegido = b.dataset.avatar;
          el.querySelector('#avatarVista').innerHTML = avatar(elegido);
          el.querySelector('#nombrePersonaje').textContent = nombrePersonaje(elegido);
          verGaleria(false);
        });
        el.querySelector('#nombre').focus();
        el.querySelector('#fPerfil').onsubmit = async e => {
          e.preventDefault();
          const pinNuevo = el.querySelector('#pin').value.trim();
          const quitar = el.querySelector('#quitarPin')?.checked;
          const body = {
            nombre: el.querySelector('#nombre').value.trim(),
            avatar: elegido,
            esInfantil: el.querySelector('#infantil').checked,
            idIdiomaPreferido: Number(el.querySelector('#idioma').value),
            pin: quitar ? '' : (pinNuevo || (esNuevo ? '' : null)),
          };
          try {
            await api(esNuevo ? '/api/perfiles' : `/api/perfiles/${p.id}`, { method: esNuevo ? 'POST' : 'PUT', body });
            cerrar();
            toast(esNuevo ? 'Perfil creado' : 'Perfil actualizado');
            cargar();
          } catch (err) {
            const eP = el.querySelector('#eP');
            eP.textContent = err.message;
            eP.classList.remove('oculto');
          }
        };
        el.querySelector('#borrar')?.addEventListener('click', async () => {
          if (!confirm(`¿Eliminar el perfil "${p.nombre}"? Se perderá su lista e historial visibles.`)) return;
          try {
            await api(`/api/perfiles/${p.id}`, { method: 'DELETE' });
            cerrar();
            toast('Perfil eliminado');
            cargar();
          } catch (err) {
            toast(err.message, 'error');
          }
        });
      }

      document.getElementById('btnAdministrar').onclick = () => { administrando = !administrando; pintar(); };
      cargar().catch(err => toast(err.message, 'error'));
    }
  </script>
</body>
</html>
