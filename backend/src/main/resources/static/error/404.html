<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página no encontrada · NovaPop</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <script src="/js/tema.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <button class="btn-tema flotante" onclick="novapopTema.alternar()" aria-label="Cambiar tema claro u oscuro" title="Cambiar tema"><span class="solo-oscuro"><svg class="ico-tema sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.3" fill="currentColor"/><path d="M12 2.6v2.3M12 19.1v2.3M2.6 12h2.3M19.1 12h2.3M5.4 5.4l1.6 1.6M17 17l1.6 1.6M5.4 18.6 7 17M17 7l1.6-1.6" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg></span><span class="solo-claro"><svg class="ico-tema luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 14.6A8.4 8.4 0 0 1 9.4 3.8a8.4 8.4 0 1 0 10.8 10.8z" fill="currentColor"/><path d="M16.6 3.2l.55 1.45 1.45.55-1.45.55-.55 1.45-.55-1.45-1.45-.55 1.45-.55z" fill="currentColor"/></svg></span></button>
  <main class="pagina-acceso pagina-error">
    <article class="tarjeta-acceso">
      <a href="/" class="marca"><img src="/img/logo.svg" alt=""><span>Nova<span class="pop">Pop</span></span></a>
      <p class="codigo-error" aria-hidden="true">404</p>
      <h1>Esta escena no existe</h1>
      <p class="sub">La página que buscas se perdió en la sala de edición. Revisa la dirección o vuelve al catálogo.</p>
      <code class="ruta-error" id="ruta"></code>
      <div class="acciones-error">
        <a href="/" class="btn btn-pop">Ir al inicio</a>
        <button class="btn btn-borde" onclick="history.length > 1 ? history.back() : location.assign('/')">Volver atrás</button>
      </div>
    </article>
  </main>
  <script>document.getElementById('ruta').textContent = location.pathname + location.search;</script>
</body>
</html>
