<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · NovaPop</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <script src="/js/tema.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <button class="btn-tema flotante" onclick="novapopTema.alternar()" aria-label="Cambiar tema claro u oscuro" title="Cambiar tema"><span class="solo-oscuro"><svg class="ico-tema sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.3" fill="currentColor"/><path d="M12 2.6v2.3M12 19.1v2.3M2.6 12h2.3M19.1 12h2.3M5.4 5.4l1.6 1.6M17 17l1.6 1.6M5.4 18.6 7 17M17 7l1.6-1.6" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg></span><span class="solo-claro"><svg class="ico-tema luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 14.6A8.4 8.4 0 0 1 9.4 3.8a8.4 8.4 0 1 0 10.8 10.8z" fill="currentColor"/><path d="M16.6 3.2l.55 1.45 1.45.55-1.45.55-.55 1.45-.55-1.45-1.45-.55 1.45-.55z" fill="currentColor"/></svg></span></button>
  <main class="pagina-acceso">
    <form class="tarjeta-acceso" id="form" novalidate>
      <a href="/" class="marca"><img src="/img/logo.svg" alt=""><span>Nova<span class="pop">Pop</span></span></a>
      <h1>Iniciar sesión</h1>
      <p class="sub">Qué bueno verte de nuevo. Las palomitas ya están listas.</p>
      <p class="error-form oculto" id="error" role="alert"></p>
      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input id="correo" name="correo" type="email" autocomplete="email" required>
      </div>
      <div class="campo">
        <label for="clave">Contraseña</label>
        <input id="clave" name="clave" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-pop" style="width:100%" id="btn">Entrar</button>
      <div class="acceso-google oculto" id="bloqueGoogle">
        <div class="separador"><span>o</span></div>
        <div class="boton-google" id="botonGoogle"></div>
      </div>
      <p class="pie">¿Nuevo en NovaPop? <a href="/registro.html">Crea tu cuenta</a></p>
    </form>
  </main>
  <script type="module">
    import { api, sesion } from '/js/api.js';
    import { botonGoogle, pendiente } from '/js/google.js';

    const form = document.getElementById('form');
    const error = document.getElementById('error');
    const mostrarError = msg => { error.textContent = msg; error.classList.remove('oculto'); };
    if (new URLSearchParams(location.search).has('expirada')) mostrarError('Tu sesión expiró. Vuelve a ingresar.');

    // Continuar con Google: si el correo ya tiene cuenta entra; si no, va al registro con el correo listo
    botonGoogle(document.getElementById('botonGoogle'), async credencial => {
      try {
        sesion.iniciar(await api('/api/auth/google', { method: 'POST', body: { credencial } }));
        location.href = '/perfiles.html';
      } catch (err) {
        if (err.estado !== 404) return mostrarError(err.message);
        pendiente.guardar(credencial);
        location.href = '/registro.html?google=1';
      }
    });

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      btn.disabled = true;
      try {
        const r = await api('/api/auth/login', { method: 'POST', body: { correo: form.correo.value, clave: form.clave.value } });
        sesion.iniciar(r);
        location.href = '/perfiles.html';
      } catch (err) {
        mostrarError(err.message);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
