spring.application.name=novapop

# Lee las credenciales desde backend/.env (no se sube a git). Ver .env.example
# Se busca en las dos rutas para que funcione tanto con "mvn spring-boot:run" (carpeta backend)
# como con el botón Run de VS Code (carpeta raíz del proyecto)
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# ---------- Base de datos (Supabase · Session pooler, compatible con IPv4) ----------
spring.datasource.url=${NOVAPOP_DB_URL}
spring.datasource.username=${NOVAPOP_DB_USER}
spring.datasource.password=${NOVAPOP_DB_PASSWORD}
# El pooler gratuito de Supabase admite pocas conexiones: mantenemos el pool pequeño
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ---------- JPA / Hibernate ----------
# "validate": Hibernate verifica que las entidades coincidan con las tablas creadas por database/01_esquema.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=novapop
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Seguridad ----------
# Clave para firmar los JWT (mínimo 32 caracteres)
novapop.jwt.secreto=${NOVAPOP_JWT_SECRET:cambia-esta-clave-por-una-larga-y-secreta-123456}
novapop.jwt.horas-validez=12

# ---------- Reproducción ----------
# Una sesión sin señal de progreso durante este tiempo deja de contar como pantalla activa
novapop.reproduccion.minutos-inactividad=2

server.port=8080
server.error.include-message=always
